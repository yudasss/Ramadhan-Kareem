<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Ramadhan Digital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN untuk menjalankan React di HTML langsung -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Komponen Ikon (Menggunakan SVG manual karena Lucide React butuh build tool)
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [isLoginView, setIsLoginView] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [activeTab, setActiveTab] = useState('tracker');

            useEffect(() => {
                const savedSession = localStorage.getItem('ramadhan_session');
                if (savedSession) {
                    setUser(JSON.parse(savedSession));
                }
                setTimeout(() => setLoading(false), 500);
            }, []);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const handleAuth = (e) => {
                e.preventDefault();
                setError('');
                const users = JSON.parse(localStorage.getItem('ramadhan_users') || '[]');

                if (isLoginView) {
                    const foundUser = users.find(u => u.email === email && u.password === password);
                    if (foundUser) {
                        setUser(foundUser);
                        localStorage.setItem('ramadhan_session', JSON.stringify(foundUser));
                    } else {
                        setError('Email atau kata sandi salah.');
                    }
                } else {
                    if (users.find(u => u.email === email)) {
                        setError('Email sudah terdaftar.');
                        return;
                    }
                    if (password.length < 6) {
                        setError('Kata sandi minimal 6 karakter.');
                        return;
                    }
                    const newUser = { email, password, uid: Date.now().toString(), records: {} };
                    localStorage.setItem('ramadhan_users', JSON.stringify([...users, newUser]));
                    setUser(newUser);
                    localStorage.setItem('ramadhan_session', JSON.stringify(newUser));
                }
            };

            const toggleStatus = (day, status) => {
                if (!user) return;
                const currentStatus = user.records[day] || 'none';
                const newStatus = currentStatus === status ? 'none' : status;
                const updatedUser = { ...user, records: { ...user.records, [day]: newStatus } };
                setUser(updatedUser);
                localStorage.setItem('ramadhan_session', JSON.stringify(updatedUser));
                
                const users = JSON.parse(localStorage.getItem('ramadhan_users') || '[]');
                const idx = users.findIndex(u => u.uid === user.uid);
                if (idx !== -1) {
                    users[idx].records = updatedUser.records;
                    localStorage.setItem('ramadhan_users', JSON.stringify(users));
                }
            };

            const stats = useMemo(() => {
                if (!user) return { full: 0, batal: 0 };
                const values = Object.values(user.records || {});
                return {
                    full: values.filter(v => v === 'full').length,
                    batal: values.filter(v => v === 'batal').length
                };
            }, [user]);

            if (loading) return (
                <div className="min-h-screen bg-emerald-950 flex items-center justify-center text-emerald-100">
                    <p className="text-xl font-bold animate-pulse tracking-widest uppercase">Memuat Jurnal...</p>
                </div>
            );

            if (!user) return (
                <div className="min-h-screen bg-emerald-950 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden">
                        <div className="bg-emerald-800 p-10 text-center text-white">
                            <h1 className="text-3xl font-black">Jurnal Ramadhan</h1>
                            <p className="text-emerald-100/70 text-sm mt-2">Simpan catatan puasa di browser Anda</p>
                        </div>
                        <form onSubmit={handleAuth} className="p-10 space-y-5">
                            {error && <div className="bg-rose-50 text-rose-700 p-3 rounded-xl text-xs font-bold">{error}</div>}
                            <input type="email" placeholder="Email" required className="w-full bg-slate-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500" value={email} onChange={e => setEmail(e.target.value)} />
                            <input type="password" placeholder="Sandi" required className="w-full bg-slate-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500" value={password} onChange={e => setPassword(e.target.value)} />
                            <button type="submit" className="w-full bg-emerald-700 text-white font-black py-4 rounded-2xl uppercase tracking-widest">{isLoginView ? 'Masuk' : 'Daftar'}</button>
                            <button type="button" onClick={() => setIsLoginView(!isLoginView)} className="w-full text-xs text-emerald-700 font-black uppercase">{isLoginView ? 'Buat Akun' : 'Sudah Punya Akun'}</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24">
                    <header className="bg-emerald-800 text-white pt-10 pb-20 px-8 rounded-b-[4rem] shadow-xl text-center md:text-left">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                            <div>
                                <h1 className="text-4xl font-black tracking-tighter">Ramadhan Kareem</h1>
                                <p className="text-emerald-200 text-xs font-bold uppercase tracking-widest mt-1">Sesi: {user.email.split('@')[0]}</p>
                            </div>
                            <div className="bg-emerald-900/40 p-4 rounded-3xl border border-emerald-700/50 text-center">
                                <p className="font-mono text-2xl font-black text-amber-400">{currentTime.toLocaleTimeString('id-ID')}</p>
                                <p className="text-[10px] uppercase font-black">{currentTime.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-6 -mt-12">
                        <section className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                            {['Full', 'Batal', 'Progres'].map((label, i) => (
                                <div key={i} className="bg-white p-6 rounded-[2.5rem] shadow-lg text-center border">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">{label}</p>
                                    <span className="text-3xl font-black">{label === 'Full' ? stats.full : label === 'Batal' ? stats.batal : Math.round((stats.full/30)*100)+'%'}</span>
                                </div>
                            ))}
                        </section>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {Array.from({ length: 30 }, (_, i) => {
                                const day = i + 1;
                                const status = user.records[day] || 'none';
                                return (
                                    <div key={day} className={`group p-8 rounded-[3rem] border transition-all duration-500 h-56 flex flex-col justify-between relative overflow-hidden ${status === 'full' ? 'bg-emerald-50 border-emerald-200 shadow-xl' : status === 'batal' ? 'bg-rose-50 border-rose-200 shadow-xl' : 'bg-white'}`}>
                                        
                                        {/* Background Number (Watermark) */}
                                        <div className={`absolute -right-4 -top-4 transition-all duration-700 group-hover:scale-110 pointer-events-none select-none ${status !== 'none' ? 'opacity-[0.1]' : 'opacity-[0.03] group-hover:opacity-[0.08]'}`}>
                                            <span className="text-[12rem] font-black italic leading-none">{day}</span>
                                        </div>

                                        <div className="flex justify-between items-center relative z-10">
                                            <span className={`w-10 h-10 rounded-xl flex items-center justify-center font-black ${status === 'full' ? 'bg-emerald-600 text-white' : status === 'batal' ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-400'}`}>{day}</span>
                                            {status !== 'none' && <Icon name={status === 'full' ? 'check-circle' : 'x-circle'} className={status === 'full' ? 'text-emerald-600' : 'text-rose-600'} />}
                                        </div>
                                        <h3 className="font-black text-xl relative z-10">Hari ke-{day}</h3>
                                        <div className="flex gap-2 relative z-10">
                                            <button onClick={() => toggleStatus(day, 'full')} className={`flex-1 py-3 rounded-2xl text-[10px] font-black uppercase border-2 transition-all ${status === 'full' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-600 border-emerald-100 hover:bg-emerald-50'}`}>Full</button>
                                            <button onClick={() => toggleStatus(day, 'batal')} className={`flex-1 py-3 rounded-2xl text-[10px] font-black uppercase border-2 transition-all ${status === 'batal' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-rose-600 border-rose-100 hover:bg-rose-50'}`}>Batal</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t py-4 px-10 flex justify-around items-center z-50 rounded-t-[2.5rem] shadow-2xl">
                        <button onClick={() => setActiveTab('tracker')} className={`flex flex-col items-center gap-1 ${activeTab === 'tracker' ? 'text-emerald-700' : 'text-slate-400'}`}>
                            <Icon name="calendar" />
                            <span className="text-[9px] font-black uppercase">Jurnal</span>
                        </button>
                        <button onClick={() => setActiveTab('doa')} className={`flex flex-col items-center gap-1 ${activeTab === 'doa' ? 'text-emerald-700' : 'text-slate-400'}`}>
                            <Icon name="book-open" />
                            <span className="text-[9px] font-black uppercase">Doa</span>
                        </button>
                        <button onClick={() => { localStorage.removeItem('ramadhan_session'); window.location.reload(); }} className="flex flex-col items-center gap-1 text-rose-400">
                            <Icon name="log-out" />
                            <span className="text-[9px] font-black uppercase">Keluar</span>
                        </button>
                    </nav>

                    {activeTab === 'doa' && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-end sm:items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] w-full max-w-2xl p-10 relative animate-in slide-in-from-bottom duration-500">
                                <button onClick={() => setActiveTab('tracker')} className="absolute top-8 right-8 text-slate-300 hover:text-rose-500"><Icon name="x-circle" size={40} /></button>
                                <h2 className="text-3xl font-black text-emerald-900 mb-8">Doa Ramadhan</h2>
                                <div className="space-y-6 max-h-[50vh] overflow-y-auto pr-4 custom-scrollbar">
                                    <div className="p-8 bg-emerald-50 rounded-[3rem] border border-emerald-100">
                                        <p className="text-3xl font-serif mb-4 text-right font-bold" dir="rtl">نَوَيْتُ صَوْمَ غَدٍ عَنْ أَدَاءِ فَرْضِ شَهْرِ رَمَضَانَ هَذِهِ السَّنَةِ لِلَّهِ تَعَالَى</p>
                                        <p className="text-xs font-bold italic text-emerald-800">"Nawaitu shauma ghadin 'an ada'i fardhi syahri Ramadhana hadzihis sanati lillahi Ta'ala."</p>
                                    </div>
                                    <div className="p-8 bg-amber-50 rounded-[3rem] border border-amber-100">
                                        <p className="text-3xl font-serif mb-4 text-right font-bold" dir="rtl">ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللَّهُ</p>
                                        <p className="text-xs font-bold italic text-amber-800">"Dzahabaz zhama'u wabtallatil 'uruqu wa tsabatal ajru, insya Allah."</p>
                                    </div>
                                </div>
                                <button onClick={() => setActiveTab('tracker')} className="w-full mt-8 bg-emerald-800 text-white py-5 rounded-3xl font-black uppercase tracking-widest text-xs">Tutup</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
